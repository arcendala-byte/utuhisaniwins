<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <rect width="1600" height="1000" fill="#E9DFC9"/>
  <defs>
    <pattern id="diag" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#171714" stroke-width="0.8" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#diag)"/>
  <!-- Corner brackets -->
  <g stroke="#171714" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M60,140 L60,60 L140,60"/>
    <path d="M1460,60 L1540,60 L1540,140"/>
    <path d="M1540,860 L1540,940 L1460,940"/>
    <path d="M140,940 L60,940 L60,860"/>
  </g>
  <!-- Small centered label -->
  <text x="800" y="510" font-family="Georgia, serif" font-size="28" fill="#66645E" text-anchor="middle" font-style="italic">Photograph coming soon</text>
  <text x="800" y="550" font-family="system-ui, sans-serif" font-size="14" fill="#66645E" text-anchor="middle" letter-spacing="3" opacity="0.7">UTUHISANIWINS</text>
</svg>